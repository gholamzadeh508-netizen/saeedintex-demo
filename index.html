<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعید اینتکس | مرجع محصولات بادی</title><link rel="stylesheet" href="/style.css"></head><body><div id="head"></div><main id="main"></main><div id="foot"></div><script src="/app.js"></script><script>
(async()=>{const d=await api('/api/site');head.innerHTML=nav('home');foot.innerHTML=footer();shopNav.href=d.settings.shopUrl;let logo=document.querySelector('.logo');if(d.settings.logo)logo.innerHTML=`<img class="logo-img" src="${d.settings.logo}" alt="سعید اینتکس">`;let out=`<section class="hero" style="background-image:url('${d.settings.hero.image}')"><div class="wrap"><div class="hero-box"><span class="eyebrow">مرجع مستقل آموزشی</span><h1>${esc(d.settings.hero.title)}</h1><p>${esc(d.settings.hero.subtitle)}</p><div class="actions"><a class="primary" target="_blank" href="${d.settings.shopUrl}">مشاهده قیمت و موجودی در فروشگاه</a><a class="secondary" href="/questions.html">سؤال خود را بپرسید</a></div></div></div></section>`;
for(const b of d.homeBlocks.filter(x=>x.enabled)){if(b.type==='categories')out+=`<section class="section"><div class="wrap"><div class="section-title"><div><h2>${esc(b.title)}</h2><p>محتوای آموزشی و انتخاب آگاهانه.</p></div></div><div class="grid4">${d.categories.map(c=>`<div class="card"><img src="${c.image}"><div class="card-body"><h3>${esc(c.title)}</h3><p>${esc(c.subtitle)}</p></div></div>`).join('')}</div></div></section>`;if(b.type==='mission')out+=`<section class="section alt"><div class="wrap"><div class="article-box"><span class="tag">تفکیک نقش دو سایت</span><h2>${esc(b.title)}</h2><p><b>saeedintex.ir</b> برای آموزش، مقایسه، عیب‌یابی و پرسش‌وپاسخ است. <b>saeedintex.com</b> برای قیمت، موجودی و خرید محصول است.</p></div></div></section>`;if(b.type==='articles')out+=`<section class="section"><div class="wrap"><div class="section-title"><h2>${esc(b.title)}</h2><a class="read" href="/articles.html">همه مقالات ←</a></div><div class="grid3">${d.articles.filter(a=>a.status==='published').slice(0,3).map(articleCard).join('')}</div></div></section>`;if(b.type==='questions')out+=`<section class="section alt"><div class="wrap"><div class="section-title"><h2>${esc(b.title)}</h2><a class="read" href="/questions.html">همه پرسش‌ها ←</a></div>${d.questions.filter(q=>q.status==='approved').slice(0,3).map(qCard).join('')}</div></section>`;if(b.type==='html'&&b.html)out+=`<section class="section"><div class="wrap">${b.html}</div></section>`}main.innerHTML=out})();
</script></body></html>
