<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سعید اینتکس</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login"><h2>ورود مدیر</h2><label>رمز مدیریت</label><input id="pass" type="password"><button class="primary" id="loginBtn">ورود</button><p id="loginMsg"></p></div>
<div id="cms" class="hidden"><div id="head"></div><div class="admin-shell"><aside class="sidebar"><h3>مدیریت سایت</h3><button class="sideitem side-brand" data-tab="brand">برند و بنر</button><button class="sideitem side-layout" data-tab="layout">چیدمان صفحه اصلی</button><button class="sideitem side-articles" data-tab="articles">مقالات و سئو</button><button class="sideitem side-qa" data-tab="qa">پرسش و پاسخ</button><button class="sideitem side-html" data-tab="html">HTML سفارشی</button><a class="sideitem side-view" href="/" target="_blank">مشاهده سایت</a><a class="sideitem side-export" href="/api/export" target="_blank">خروجی کامل اطلاعات</a></aside><main><div id="workspace"></div><div class="savebar"><button class="primary" id="save">ذخیره همه تغییرات</button> <span id="saveMsg"></span></div></main></div></div>
<script src="/app.js"></script><script>
let D=null,tab='brand',editingArticleIndex=null,articleSort='newest',articleSearch='';
loginBtn.onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});await loadAdmin()}catch(e){loginMsg.textContent=e.message}};
async function loadAdmin(){D=await api('/api/admin/site');login.classList.add('hidden');cms.classList.remove('hidden');head.innerHTML=nav();shopNav.href=D.settings.shopUrl;render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sync();tab=b.dataset.tab;if(tab!=='articles')editingArticleIndex=null;render()});
function imageField(label,value,id,role,attrs=''){return `<label>${label}</label><div class="image-field"><div class="form-grid"><input id="${id}" ${attrs} value="${esc(value||'')}"><div><input type="file" accept="image/*" id="${id}File"><button class="smallbtn upload-btn" type="button" onclick="doUpload('${id}','${role}')">آپلود و بهینه‌سازی خودکار</button></div></div><div class="image-feedback"><img id="${id}Preview" class="image-preview ${value?'':'hidden'}" src="${esc(value||'')}" alt=""><small id="${id}Info" class="muted"></small></div></div>`}
function kb(n){return Math.max(1,Math.round((n||0)/1024))}
async function doUpload(id,role){
  const f=document.getElementById(id+'File').files[0];if(!f)return alert('عکس را انتخاب کنید');
  const btn=event?.target,old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='در حال بهینه‌سازی...'}
  try{
    const r=await uploadImage(f,role),inp=document.getElementById(id),prev=document.getElementById(id+'Preview'),info=document.getElementById(id+'Info');
    inp.value=r.url;prev.src=r.url;prev.classList.remove('hidden');
    info.textContent=`${r.originalWidth}×${r.originalHeight} و ${kb(r.beforeBytes)}KB → ${r.width}×${r.height} WebP و ${kb(r.afterBytes)}KB`;
  }catch(e){alert('خطای آپلود: '+e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
function sync(){if(!D)return;if(tab==='brand'){D.settings.brand=brandName?.value||D.settings.brand;D.settings.logo=logo?.value||'';D.settings.hero.title=heroTitle?.value||'';D.settings.hero.subtitle=heroSub?.value||'';D.settings.hero.image=heroImage?.value||'';D.settings.shopUrl=shopUrl?.value||''}
if(tab==='layout'){D.homeBlocks=[...document.querySelectorAll('.block-row')].map(el=>{const b=D.homeBlocks.find(x=>x.id===el.dataset.id);b.title=el.querySelector('.btitle').value;b.enabled=el.querySelector('.benabled').checked;return b})}
if(tab==='articles'&&editingArticleIndex!==null){let changed=false;document.querySelectorAll('[data-ai]').forEach(el=>{const a=D.articles[+el.dataset.ai],k=el.dataset.k;if(!a)return;if(k==='body')a.body=el.innerHTML;else if(k.startsWith('seo.'))a.seo[k.split('.')[1]]=el.value;else a[k]=el.value;changed=true});if(changed&&D.articles[editingArticleIndex])D.articles[editingArticleIndex].updatedAt=new Date().toISOString().slice(0,10)}
if(tab==='html'){D.customHtml=customHtml?.value||'';let b=D.homeBlocks.find(x=>x.type==='html');if(D.customHtml.trim()){if(!b)D.homeBlocks.push({id:'custom-html',type:'html',title:'HTML سفارشی',enabled:true,html:D.customHtml});else b.html=D.customHtml}else D.homeBlocks=D.homeBlocks.filter(x=>x.type!=='html')}}
function renderCore(){if(tab==='brand')workspace.innerHTML=`<div class="panel"><h2>برند و بنر اصلی</h2><label>نام برند</label><input id="brandName" value="${esc(D.settings.brand)}">${imageField('لوگو',D.settings.logo,'logo','logo')}<label>عنوان بنر</label><textarea id="heroTitle">${esc(D.settings.hero.title)}</textarea><label>زیرعنوان بنر</label><textarea id="heroSub">${esc(D.settings.hero.subtitle)}</textarea>${imageField('تصویر بنر',D.settings.hero.image,'heroImage','hero')}<label>آدرس فروشگاه اصلی</label><input id="shopUrl" value="${esc(D.settings.shopUrl)}"></div>`;
if(tab==='layout'){workspace.innerHTML=`<div class="panel"><h2>چیدمان صفحه اصلی</h2><p class="notice">بلوک‌ها را با کشیدن جابه‌جا کنید؛ نمایش هر بخش هم قابل خاموش‌کردن است.</p><div id="blocks">${D.homeBlocks.map(b=>`<div class="block-row" draggable="true" data-id="${b.id}"><span class="drag">☰</span><input class="btitle grow" value="${esc(b.title)}"><label><input class="benabled" type="checkbox" ${b.enabled?'checked':''}> نمایش</label></div>`).join('')}</div></div>`;enableDrag()}
if(tab==='articles'){workspace.innerHTML=renderArticlesArea()}
if(tab==='qa'){workspace.innerHTML=`<div class="panel"><h2>مدیریت پرسش و پاسخ</h2>${D.questions.map((q,qi)=>`<div class="qa"><b>${esc(q.title)}</b><p>${esc(q.body)}</p><label>وضعیت سؤال</label><select onchange="D.questions[${qi}].status=this.value"><option value="approved" ${q.status==='approved'?'selected':''}>تأیید</option><option value="pending" ${q.status==='pending'?'selected':''}>در انتظار</option><option value="rejected">رد</option></select>${(q.answers||[]).map((a,ai)=>`<div class="answer"><b>${esc(a.author)}</b><p>${esc(a.body)}</p><label><input type="checkbox" ${a.official?'checked':''} onchange="D.questions[${qi}].answers[${ai}].official=this.checked"> پاسخ رسمی سعید اینتکس</label><select onchange="D.questions[${qi}].answers[${ai}].status=this.value"><option value="approved" ${a.status==='approved'?'selected':''}>تأیید</option><option value="pending" ${a.status==='pending'?'selected':''}>در انتظار</option><option value="rejected">رد</option></select></div>`).join('')}</div>`).join('')}</div>`}
if(tab==='html')workspace.innerHTML=`<div class="panel"><h2>HTML سفارشی</h2><p class="notice">این بخش از هسته سایت جداست و می‌تواند بدون دست‌زدن به ساختار اصلی اضافه یا حذف شود.</p><label>HTML / CSS سفارشی</label><textarea id="customHtml" style="min-height:330px">${esc(D.customHtml||'')}</textarea></div>`}



function faNum(n){return new Intl.NumberFormat('fa-IR').format(Number(n||0))}
function articleStatusText(s){return s==='published'?'منتشر شده':'پیش‌نویس'}
function articleListItems(){
  let arr=(D.articles||[]).map((a,i)=>({a,i}));
  if(articleSearch.trim()){
    const q=articleSearch.trim().toLowerCase();
    arr=arr.filter(x=>(x.a.title||'').toLowerCase().includes(q)||(x.a.category||'').toLowerCase().includes(q));
  }
  if(articleSort==='views')arr.sort((x,y)=>Number(y.a.views||0)-Number(x.a.views||0));
  else if(articleSort==='title')arr.sort((x,y)=>(x.a.title||'').localeCompare(y.a.title||'','fa'));
  else arr.sort((x,y)=>(y.a.updatedAt||y.a.createdAt||'').localeCompare(x.a.updatedAt||x.a.createdAt||''));
  return arr;
}
function renderArticlesArea(){
  if(editingArticleIndex===null){
    const items=articleListItems();
    const total=(D.articles||[]).reduce((s,a)=>s+Number(a.views||0),0);
    return `<div class="panel article-list-panel">
      <div class="article-list-head">
        <div><h2>مقالات</h2><p class="muted">تعداد مقالات: ${faNum(D.articles.length)} · مجموع بازدید ثبت‌شده: ${faNum(total)}</p></div>
        <div class="article-list-actions"><button class="primary" onclick="newArticle()">+ مقاله جدید</button><button class="smallbtn" onclick="generateArticleAI()">نوشتن مقاله کامل با AI</button></div>
      </div>
      <div class="article-list-tools"><input id="articleSearch" value="${esc(articleSearch)}" placeholder="جستجوی عنوان مقاله..." oninput="articleSearch=this.value;render()"><select onchange="articleSort=this.value;render()"><option value="newest" ${articleSort==='newest'?'selected':''}>جدیدترین ویرایش</option><option value="views" ${articleSort==='views'?'selected':''}>پربازدیدترین</option><option value="title" ${articleSort==='title'?'selected':''}>عنوان الفبایی</option></select></div>
      <div class="article-table article-table-head"><div>عنوان مقاله</div><div>وضعیت</div><div>بازدید</div><div>آخرین ویرایش</div><div>عملیات</div></div>
      <div class="article-list">${items.length?items.map(({a,i})=>`<div class="article-table article-row">
        <button class="article-title-link" onclick="editArticle(${i})">${esc(a.title||'بدون عنوان')}</button>
        <div><span class="status-pill ${a.status==='published'?'published':'draft'}">${articleStatusText(a.status)}</span></div>
        <div class="views-cell"><b>${faNum(a.views||0)}</b><small> بازدید</small></div>
        <div class="muted">${esc(a.updatedAt||a.createdAt||'—')}</div>
        <div class="row-actions"><button class="smallbtn" onclick="editArticle(${i})">ویرایش</button><a class="smallbtn view-row-btn" href="/article.html?id=${encodeURIComponent(a.id)}" target="_blank">مشاهده</a></div>
      </div>`).join(''):`<div class="empty-state">مقاله‌ای پیدا نشد.</div>`}</div>
      <p class="notice article-views-note">بازدید هر مقاله در همین فهرست نمایش داده می‌شود و می‌توانی فهرست را بر اساس «پربازدیدترین» مرتب کنی.</p>
    </div>`;
  }
  const i=editingArticleIndex,a=D.articles[i];
  if(!a){editingArticleIndex=null;return renderArticlesArea()}
  return `<div class="panel article-editor-top">
    <div class="article-editor-head">
      <div><button class="smallbtn back-list-btn" onclick="backToArticleList()">← فهرست مقالات</button><h2>${esc(a.title||'ویرایش مقاله')}</h2><span class="views-badge">👁 ${faNum(a.views||0)} بازدید</span></div>
      <div><a class="smallbtn view-row-btn" href="/article.html?id=${encodeURIComponent(a.id)}" target="_blank">مشاهده در سایت</a></div>
    </div>
    <p class="notice">هوش مصنوعی فقط پیشنهاد می‌دهد؛ قبل از اعمال، پیش‌نمایش و تأیید شما لازم است.</p>
  </div>
  <div class="panel">
    <div class="form-grid"><div><label>عنوان</label><input data-ai="${i}" data-k="title" value="${esc(a.title)}"></div><div><label>وضعیت</label><select data-ai="${i}" data-k="status"><option value="published" ${a.status==='published'?'selected':''}>منتشر شده</option><option value="draft" ${a.status==='draft'?'selected':''}>پیش‌نویس</option></select></div></div>
    <label>چکیده</label><textarea data-ai="${i}" data-k="excerpt">${esc(a.excerpt||'')}</textarea>
    <div class="toolbar"><button onclick="aiAction(${i},'excerpt')">نوشتن چکیده با AI</button></div>
    <label>متن مقاله</label>
    <div class="toolbar"><button onclick="aiAction(${i},'write_body')">نوشتن متن مقاله با AI</button><button onclick="aiAction(${i},'article')">بازنویسی و بهینه‌سازی با AI</button><button onclick="aiAction(${i},'continue_body')">ادامه متن با AI</button><button class="format-btn" onmousedown="event.preventDefault();editorBold(${i})"><b>B</b> Bold</button><button class="format-btn" onmousedown="event.preventDefault();editorLink(${i})">🔗 لینک</button><button class="format-btn" onmousedown="event.preventDefault();editorUnlink(${i})">حذف لینک</button><button class="ai-link-btn" onclick="aiAction(${i},'links')">✨ پیشنهاد لینک با AI</button><button class="link-audit-btn" onclick="auditArticleLinks(${i})">🔎 بررسی لینک‌های فعلی</button></div>
    <div class="editor" id="articleEditor${i}" contenteditable="true" data-ai="${i}" data-k="body">${a.body||''}</div>
    ${imageField('تصویر شاخص',a.image||'','articleImage'+i,'article',`data-ai="${i}" data-k="image"`)}
    <label>ویدیو (آپارات / یوتیوب / لینک)</label><input data-ai="${i}" data-k="video" value="${esc(a.video||'')}">
    <h3>سئو</h3>
    <div class="form-grid"><div><label>حالت</label><select data-ai="${i}" data-k="seo.mode"><option value="auto" ${a.seo?.mode==='auto'?'selected':''}>خودکار</option><option value="manual" ${a.seo?.mode==='manual'?'selected':''}>دستی</option><option value="ai" ${a.seo?.mode==='ai'?'selected':''}>هوش مصنوعی</option></select></div><div><label>Slug</label><input data-ai="${i}" data-k="seo.slug" value="${esc(a.seo?.slug||'')}"></div><div><label>SEO Title</label><input data-ai="${i}" data-k="seo.title" value="${esc(a.seo?.title||'')}"></div><div><label>Meta Description</label><textarea data-ai="${i}" data-k="seo.description">${esc(a.seo?.description||'')}</textarea></div></div>
    <div class="article-editor-actions"><button class="smallbtn" onclick="seoPreview(${i})">تولید خودکار سئو</button><button class="smallbtn" onclick="aiAction(${i},'seo')">پیشنهاد AI</button><button class="smallbtn view-article-btn" onclick="saveAndViewArticle(${i}, event)">👁 ذخیره و مشاهده در سایت</button><button class="smallbtn danger" onclick="delArticle(${i})">حذف</button></div>
  </div>`;
}
function editArticle(i){sync();editingArticleIndex=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function backToArticleList(){sync();editingArticleIndex=null;render();window.scrollTo({top:0,behavior:'smooth'})}

function refreshSidebarActive(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
}
function render(){renderCore();refreshSidebarActive();if(tab==='articles'&&editingArticleIndex!==null)setTimeout(bindEditors,0)}

const editorRanges={};
function bindEditors(){
  document.querySelectorAll('.editor[data-ai]').forEach(ed=>{
    const i=+ed.dataset.ai;
    ['mouseup','keyup','input','focus'].forEach(ev=>ed.addEventListener(ev,()=>rememberEditorSelection(i)));
    ed.addEventListener('click',e=>{
      const link=e.target.closest('a[href]');
      if(link&&!e.shiftKey){e.preventDefault();window.open(link.getAttribute('href'),'_blank','noopener')}
    });
  });
}
function rememberEditorSelection(i){
  const ed=document.getElementById('articleEditor'+i),sel=window.getSelection();
  if(!ed||!sel||!sel.rangeCount)return;
  const r=sel.getRangeAt(0);
  if(ed.contains(r.commonAncestorContainer))editorRanges[i]=r.cloneRange();
}
function restoreEditorSelection(i){
  const ed=document.getElementById('articleEditor'+i),sel=window.getSelection();
  if(!ed||!sel)return false;ed.focus();sel.removeAllRanges();
  if(editorRanges[i])sel.addRange(editorRanges[i]);
  else{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);sel.addRange(r)}
  return true;
}
function editorBold(i){if(!restoreEditorSelection(i))return;document.execCommand('bold',false,null);rememberEditorSelection(i)}
function normalizeLink(url){
  url=(url||'').trim();if(!url)return '';
  if(url.startsWith('/')||/^https?:\/\//i.test(url))return url;
  return 'https://'+url;
}
function editorLink(i){
  if(!restoreEditorSelection(i))return;
  const sel=window.getSelection();if(!sel||sel.isCollapsed)return alert('اول بخشی از متن را انتخاب کنید.');
  const url=normalizeLink(prompt('آدرس لینک را وارد کنید. برای لینک داخلی می‌توانید از /article.html?... استفاده کنید:'));
  if(!url)return;document.execCommand('createLink',false,url);rememberEditorSelection(i)
}
function editorUnlink(i){if(!restoreEditorSelection(i))return;document.execCommand('unlink',false,null);rememberEditorSelection(i)}

function enableDrag(){let drag=null;document.querySelectorAll('.block-row').forEach(el=>{el.ondragstart=()=>drag=el;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(drag!==el){const a=[...blocks.children],di=a.indexOf(drag),ti=a.indexOf(el);blocks.insertBefore(drag,ti>di?el.nextSibling:el)}}})}
function newArticle(){sync();const now=new Date().toISOString().slice(0,10);D.articles.unshift({id:'a'+Date.now(),status:'draft',category:'آموزش',title:'مقاله جدید',excerpt:'',image:'',video:'',body:'<p>متن مقاله...</p>',views:0,createdAt:now,updatedAt:now,seo:{mode:'auto',title:'',description:'',slug:'article-'+Date.now(),canonical:'',ogImage:'',schemaType:'Article'}});editingArticleIndex=0;render()}
function delArticle(i){if(confirm('مقاله حذف شود؟')){sync();D.articles.splice(i,1);editingArticleIndex=null;render()}}
async function seoPreview(i){sync();const s=await api('/api/seo/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D.articles[i])});D.articles[i].seo={...D.articles[i].seo,...s,mode:'auto'};render()}


function knownLinkTargets(){
  const m=new Map([
    ['/','خانه'],
    ['/articles.html','همه مقالات'],
    ['/guide.html','راهنمای انتخاب محصول'],
    ['/questions.html','پرسش و پاسخ کاربران'],
    ['/about.html','درباره سایت']
  ]);
  (D.articles||[]).filter(a=>a.status==='published').forEach(a=>m.set('/article.html?id='+encodeURIComponent(a.id),a.title));
  return m;
}
function applyOneSuggestedLink(html,phrase,url){
  const box=document.createElement('div');box.innerHTML=html||'';
  const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const p=node.parentElement;
      if(!p||p.closest('a,script,style,h1,h2,h3'))return NodeFilter.FILTER_REJECT;
      return (node.nodeValue||'').includes(phrase)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP;
    }
  });
  const node=walker.nextNode();
  if(!node)return {html:box.innerHTML,applied:false};
  const text=node.nodeValue,idx=text.indexOf(phrase);
  if(idx<0)return {html:box.innerHTML,applied:false};
  const parent=node.parentNode;
  if(idx>0)parent.insertBefore(document.createTextNode(text.slice(0,idx)),node);
  const link=document.createElement('a');link.setAttribute('href',url);link.textContent=phrase;
  if(/^https?:\/\//i.test(url))link.setAttribute('target','_blank');
  parent.insertBefore(link,node);
  if(idx+phrase.length<text.length)parent.insertBefore(document.createTextNode(text.slice(idx+phrase.length)),node);
  parent.removeChild(node);
  return {html:box.innerHTML,applied:true};
}
function applyApprovedLinkSuggestions(article,suggestions){
  let html=article.body||'',applied=0,missed=[];
  for(const s of suggestions){
    const r=applyOneSuggestedLink(html,s.text,s.url);
    html=r.html;
    if(r.applied)applied++;else missed.push(s.text);
  }
  article.body=html;
  return {applied,missed};
}
function linkSuggestionOverlay(article,suggestions){
  if(!Array.isArray(suggestions)||!suggestions.length){
    alert('هوش مصنوعی برای این مقاله لینک مناسبی پیدا نکرد.');
    return;
  }
  const rows=suggestions.map((s,i)=>`<div class="link-suggestion-row">
    <label class="link-check"><input type="checkbox" class="link-suggest-check" data-i="${i}" checked> تأیید</label>
    <div class="link-suggest-main"><div><strong>${esc(s.text||'')}</strong> <span class="link-type-pill ${s.type==='store'?'store':''}">${s.type==='store'?'فروشگاه اصلی':'لینک داخلی'}</span></div>
    <div class="link-target">← ${esc(s.targetTitle||s.url||'')}</div><small>${esc(s.reason||'')}</small></div>
    <a class="smallbtn" href="${esc(s.url||'#')}" target="_blank">بازکردن مقصد</a>
  </div>`).join('');
  aiOverlay(`<p class="notice">فقط مواردی که تأیید می‌کنی روی متن اعمال می‌شوند. هیچ لینکی بدون تأیید شما ساخته نمی‌شود.</p><div>${rows}</div>`,o=>{
    const selected=[...o.querySelectorAll('.link-suggest-check:checked')].map(ch=>suggestions[+ch.dataset.i]);
    if(!selected.length)return;
    const result=applyApprovedLinkSuggestions(article,selected);
    render();
    setTimeout(()=>alert(`${result.applied} لینک اعمال شد.${result.missed.length?' عبارت پیدا نشد: '+result.missed.join('، '):''}`),50);
  },'پیشنهاد لینک‌های هوشمند');
}
function auditArticleLinks(i){
  sync();const a=D.articles[i];if(!a)return;
  const box=document.createElement('div');box.innerHTML=a.body||'';
  const links=[...box.querySelectorAll('a[href]')],known=knownLinkTargets(),shop=D.settings.shopUrl||'';
  if(!links.length)return alert('در متن این مقاله هنوز لینکی وجود ندارد.');
  const rows=links.map(x=>{
    const href=x.getAttribute('href')||'',anchor=(x.textContent||'').trim();
    let label='',state='ok';
    if(known.has(href))label=known.get(href);
    else if(shop&&(href===shop||href.startsWith(shop+'/'))){label='فروشگاه اصلی سعید اینتکس';state='store'}
    else if(/^https?:\/\//i.test(href)){label='لینک خارجی؛ نیازمند بررسی';state='review'}
    else {label='مقصد در ساختار فعلی سایت پیدا نشد';state='review'}
    return `<div class="link-audit-row"><div><strong>${esc(anchor||'(بدون متن)')}</strong><div class="link-target">${esc(href)}</div><small>${esc(label)}</small></div><span class="audit-state ${state}">${state==='ok'?'معتبر':state==='store'?'فروشگاه':'بررسی شود'}</span></div>`;
  }).join('');
  aiOverlay(`<p class="notice">این گزارش لینک‌های فعلی مقاله را با صفحات شناخته‌شده سایت مقایسه می‌کند.</p>${rows}`,()=>{},'بررسی لینک‌های فعلی',false);
}

function aiOverlay(inner,onApply,title='پیش‌نمایش پیشنهاد هوش مصنوعی',showApply=true){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  o.innerHTML=`<div style="background:#fff;width:min(900px,96vw);max-height:88vh;overflow:auto;border-radius:18px;padding:22px;direction:rtl"><h2>${esc(title)}</h2>${inner}<div style="margin-top:18px">${showApply?'<button class="primary ai-apply">تأیید و اعمال</button> ':''}<button class="smallbtn ai-cancel">${showApply?'انصراف':'بستن'}</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('.ai-cancel').onclick=()=>o.remove();
  if(showApply)o.querySelector('.ai-apply').onclick=()=>{onApply(o);o.remove()}
}
async function aiAction(i,type){
  sync(); const a=D.articles[i]; if(!a)return;
  const btn=event?.target; const old=btn?.textContent; if(btn){btn.disabled=true;btn.textContent='در حال پردازش...'}
  try{
    const r=await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:type,article:a})});
    if(type==='excerpt'){
      aiOverlay(`<label>چکیده پیشنهادی</label><textarea id="aiExcerpt">${esc(r.excerpt||'')}</textarea>`,o=>{a.excerpt=o.querySelector('#aiExcerpt').value;render()});
    }else if(type==='write_body'){
      aiOverlay(`<label>متن پیشنهادی مقاله</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{a.body=o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='continue_body'){
      aiOverlay(`<label>ادامه پیشنهادی متن</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{a.body=(a.body||'')+o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='article'){
      aiOverlay(`<label>چکیده پیشنهادی</label><textarea id="aiExcerpt">${esc(r.excerpt||a.excerpt||'')}</textarea><label>متن بازنویسی‌شده</label><div id="aiBody" class="editor" contenteditable="true">${r.body||a.body||''}</div>`,o=>{a.excerpt=o.querySelector('#aiExcerpt').value;a.body=o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='seo'){
      aiOverlay(`<div class="form-grid"><div><label>SEO Title</label><input id="aiSeoTitle" value="${esc(r.title||'')}"></div><div><label>Slug</label><input id="aiSlug" value="${esc(r.slug||'')}"></div></div><label>Meta Description</label><textarea id="aiDesc">${esc(r.description||'')}</textarea>`,o=>{a.seo={...a.seo,mode:'ai',title:o.querySelector('#aiSeoTitle').value,slug:o.querySelector('#aiSlug').value,description:o.querySelector('#aiDesc').value};render()});
    }else if(type==='links'){
      linkSuggestionOverlay(a,r.suggestions||[]);
    }
  }catch(e){alert('خطا: '+e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
async function generateArticleAI(){
  sync(); const topic=prompt('موضوع مقاله را بنویسید:'); if(!topic)return;
  try{
    const r=await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'generate',topic,article:{title:topic,excerpt:'',body:'',category:'آموزش'}})});
    aiOverlay(`<label>عنوان</label><input id="aiTitle" value="${esc(r.title||topic)}"><label>چکیده</label><textarea id="aiExcerpt">${esc(r.excerpt||'')}</textarea><label>متن مقاله</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{
      const now=new Date().toISOString().slice(0,10);D.articles.unshift({id:'a'+Date.now(),status:'draft',category:r.category||'آموزش',title:o.querySelector('#aiTitle').value,excerpt:o.querySelector('#aiExcerpt').value,image:'',video:'',body:o.querySelector('#aiBody').innerHTML,views:0,createdAt:now,updatedAt:now,seo:{mode:'auto',title:'',description:'',slug:'article-'+Date.now(),canonical:'',ogImage:'',schemaType:'Article'}});
      editingArticleIndex=0;render();
    });
  }catch(e){alert('خطا: '+e.message)}
}

async function saveAndViewArticle(i,ev){
  sync();
  const a=D.articles[i];
  if(!a)return;
  const btn=ev?.currentTarget,old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='در حال ذخیره...'}
  try{
    await api('/api/admin/site',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});
    saveMsg.className='success';
    saveMsg.textContent='✓ ذخیره شد';
    window.open('/article.html?id='+encodeURIComponent(a.id),'_blank','noopener');
  }catch(e){
    alert('خطا در ذخیره و مشاهده: '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old}
  }
}

save.onclick=async()=>{sync();try{await api('/api/admin/site',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});saveMsg.className='success';saveMsg.textContent='✓ ذخیره شد'}catch(e){saveMsg.textContent=e.message}};
