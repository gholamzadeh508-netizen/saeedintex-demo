<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سعید اینتکس</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login"><h2>ورود مدیر</h2><label>رمز مدیریت</label><input id="pass" type="password"><button class="primary" id="loginBtn">ورود</button><p id="loginMsg"></p></div>
<div id="cms" class="hidden"><div id="head"></div><div class="admin-shell"><aside class="sidebar"><h3>مدیریت سایت</h3><button class="sideitem" data-tab="brand">برند و بنر</button><button class="sideitem" data-tab="layout">چیدمان صفحه اصلی</button><button class="sideitem" data-tab="articles">مقالات و سئو</button><button class="sideitem" data-tab="qa">پرسش و پاسخ</button><button class="sideitem" data-tab="html">HTML سفارشی</button><a class="sideitem" href="/" target="_blank">مشاهده سایت</a><a class="sideitem" href="/api/export" target="_blank">خروجی کامل اطلاعات</a></aside><main><div id="workspace"></div><div class="savebar"><button class="primary" id="save">ذخیره همه تغییرات</button> <span id="saveMsg"></span></div></main></div></div>
<script src="/app.js"></script><script>
let D=null,tab='brand';
loginBtn.onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});await loadAdmin()}catch(e){loginMsg.textContent=e.message}};
async function loadAdmin(){D=await api('/api/admin/site');login.classList.add('hidden');cms.classList.remove('hidden');head.innerHTML=nav();shopNav.href=D.settings.shopUrl;render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sync();tab=b.dataset.tab;render()});
function imageField(label,value,id,role){return `<label>${label}</label><div class="form-grid"><input id="${id}" value="${esc(value||'')}"><div><input type="file" accept="image/*" id="${id}File"><button class="smallbtn" type="button" onclick="doUpload('${id}','${role}')">آپلود و بهینه‌سازی خودکار</button></div></div>`}
async function doUpload(id,role){const f=document.getElementById(id+'File').files[0];if(!f)return alert('عکس را انتخاب کنید');const r=await uploadImage(f,role);document.getElementById(id).value=r.url;alert('عکس بهینه و آپلود شد')}
function sync(){if(!D)return;if(tab==='brand'){D.settings.brand=brandName?.value||D.settings.brand;D.settings.logo=logo?.value||'';D.settings.hero.title=heroTitle?.value||'';D.settings.hero.subtitle=heroSub?.value||'';D.settings.hero.image=heroImage?.value||'';D.settings.shopUrl=shopUrl?.value||''}
if(tab==='layout'){D.homeBlocks=[...document.querySelectorAll('.block-row')].map(el=>{const b=D.homeBlocks.find(x=>x.id===el.dataset.id);b.title=el.querySelector('.btitle').value;b.enabled=el.querySelector('.benabled').checked;return b})}
if(tab==='articles'){document.querySelectorAll('[data-ai]').forEach(el=>{const a=D.articles[+el.dataset.ai],k=el.dataset.k;if(k==='body')a.body=el.innerHTML;else if(k.startsWith('seo.'))a.seo[k.split('.')[1]]=el.value;else a[k]=el.value})}
if(tab==='html'){D.customHtml=customHtml?.value||'';let b=D.homeBlocks.find(x=>x.type==='html');if(D.customHtml.trim()){if(!b)D.homeBlocks.push({id:'custom-html',type:'html',title:'HTML سفارشی',enabled:true,html:D.customHtml});else b.html=D.customHtml}else D.homeBlocks=D.homeBlocks.filter(x=>x.type!=='html')}}
function render(){if(tab==='brand')workspace.innerHTML=`<div class="panel"><h2>برند و بنر اصلی</h2><label>نام برند</label><input id="brandName" value="${esc(D.settings.brand)}">${imageField('لوگو',D.settings.logo,'logo','logo')}<label>عنوان بنر</label><textarea id="heroTitle">${esc(D.settings.hero.title)}</textarea><label>زیرعنوان بنر</label><textarea id="heroSub">${esc(D.settings.hero.subtitle)}</textarea>${imageField('تصویر بنر',D.settings.hero.image,'heroImage','hero')}<label>آدرس فروشگاه اصلی</label><input id="shopUrl" value="${esc(D.settings.shopUrl)}"></div>`;
if(tab==='layout'){workspace.innerHTML=`<div class="panel"><h2>چیدمان صفحه اصلی</h2><p class="notice">بلوک‌ها را با کشیدن جابه‌جا کنید؛ نمایش هر بخش هم قابل خاموش‌کردن است.</p><div id="blocks">${D.homeBlocks.map(b=>`<div class="block-row" draggable="true" data-id="${b.id}"><span class="drag">☰</span><input class="btitle grow" value="${esc(b.title)}"><label><input class="benabled" type="checkbox" ${b.enabled?'checked':''}> نمایش</label></div>`).join('')}</div></div>`;enableDrag()}
if(tab==='articles'){workspace.innerHTML=`<div class="panel"><h2>مقالات</h2><button class="primary" onclick="newArticle()">+ مقاله جدید</button> <button class="smallbtn" onclick="generateArticleAI()">نوشتن مقاله کامل با AI</button><p class="notice">هوش مصنوعی فقط پیشنهاد می‌دهد؛ قبل از اعمال، پیش‌نمایش و تأیید شما لازم است.</p></div>`+D.articles.map((a,i)=>`<div class="panel"><div class="form-grid"><div><label>عنوان</label><input data-ai="${i}" data-k="title" value="${esc(a.title)}"></div><div><label>وضعیت</label><select data-ai="${i}" data-k="status"><option value="published" ${a.status==='published'?'selected':''}>منتشر شده</option><option value="draft" ${a.status==='draft'?'selected':''}>پیش‌نویس</option></select></div></div><label>چکیده</label><textarea data-ai="${i}" data-k="excerpt">${esc(a.excerpt||'')}</textarea><div class="toolbar"><button onclick="aiAction(${i},'excerpt')">نوشتن چکیده با AI</button></div><label>متن مقاله</label><div class="toolbar"><button onclick="aiAction(${i},'write_body')">نوشتن متن مقاله با AI</button><button onclick="aiAction(${i},'article')">بازنویسی و بهینه‌سازی با AI</button><button onclick="aiAction(${i},'continue_body')">ادامه متن با AI</button><button onclick="document.execCommand('bold')">Bold</button><button onclick="document.execCommand('createLink',false,prompt('آدرس لینک'))">لینک</button></div><div class="editor" contenteditable="true" data-ai="${i}" data-k="body">${a.body||''}</div>${imageField('تصویر شاخص',a.image||'','articleImage'+i,'article')}<input type="hidden" data-ai="${i}" data-k="image" id="articleImage${i}" value="${esc(a.image||'')}"><label>ویدیو (آپارات / یوتیوب / لینک)</label><input data-ai="${i}" data-k="video" value="${esc(a.video||'')}"><h3>سئو</h3><div class="form-grid"><div><label>حالت</label><select data-ai="${i}" data-k="seo.mode"><option value="auto" ${a.seo?.mode==='auto'?'selected':''}>خودکار</option><option value="manual" ${a.seo?.mode==='manual'?'selected':''}>دستی</option><option value="ai" ${a.seo?.mode==='ai'?'selected':''}>هوش مصنوعی</option></select></div><div><label>Slug</label><input data-ai="${i}" data-k="seo.slug" value="${esc(a.seo?.slug||'')}"></div><div><label>SEO Title</label><input data-ai="${i}" data-k="seo.title" value="${esc(a.seo?.title||'')}"></div><div><label>Meta Description</label><textarea data-ai="${i}" data-k="seo.description">${esc(a.seo?.description||'')}</textarea></div></div><button class="smallbtn" onclick="seoPreview(${i})">تولید خودکار سئو</button> <button class="smallbtn" onclick="aiAction(${i},'seo')">پیشنهاد AI</button> <button class="smallbtn danger" onclick="delArticle(${i})">حذف</button></div>`).join('')}
if(tab==='qa'){workspace.innerHTML=`<div class="panel"><h2>مدیریت پرسش و پاسخ</h2>${D.questions.map((q,qi)=>`<div class="qa"><b>${esc(q.title)}</b><p>${esc(q.body)}</p><label>وضعیت سؤال</label><select onchange="D.questions[${qi}].status=this.value"><option value="approved" ${q.status==='approved'?'selected':''}>تأیید</option><option value="pending" ${q.status==='pending'?'selected':''}>در انتظار</option><option value="rejected">رد</option></select>${(q.answers||[]).map((a,ai)=>`<div class="answer"><b>${esc(a.author)}</b><p>${esc(a.body)}</p><label><input type="checkbox" ${a.official?'checked':''} onchange="D.questions[${qi}].answers[${ai}].official=this.checked"> پاسخ رسمی سعید اینتکس</label><select onchange="D.questions[${qi}].answers[${ai}].status=this.value"><option value="approved" ${a.status==='approved'?'selected':''}>تأیید</option><option value="pending" ${a.status==='pending'?'selected':''}>در انتظار</option><option value="rejected">رد</option></select></div>`).join('')}</div>`).join('')}</div>`}
if(tab==='html')workspace.innerHTML=`<div class="panel"><h2>HTML سفارشی</h2><p class="notice">این بخش از هسته سایت جداست و می‌تواند بدون دست‌زدن به ساختار اصلی اضافه یا حذف شود.</p><label>HTML / CSS سفارشی</label><textarea id="customHtml" style="min-height:330px">${esc(D.customHtml||'')}</textarea></div>`}
function enableDrag(){let drag=null;document.querySelectorAll('.block-row').forEach(el=>{el.ondragstart=()=>drag=el;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(drag!==el){const a=[...blocks.children],di=a.indexOf(drag),ti=a.indexOf(el);blocks.insertBefore(drag,ti>di?el.nextSibling:el)}}})}
function newArticle(){sync();D.articles.unshift({id:'a'+Date.now(),status:'draft',category:'آموزش',title:'مقاله جدید',excerpt:'',image:'',video:'',body:'<p>متن مقاله...</p>',seo:{mode:'auto',title:'',description:'',slug:'article-'+Date.now(),canonical:'',ogImage:'',schemaType:'Article'}});render()}
function delArticle(i){if(confirm('مقاله حذف شود؟')){sync();D.articles.splice(i,1);render()}}
async function seoPreview(i){sync();const s=await api('/api/seo/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D.articles[i])});D.articles[i].seo={...D.articles[i].seo,...s,mode:'auto'};render()}

function aiOverlay(inner,onApply){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  o.innerHTML=`<div style="background:#fff;width:min(900px,96vw);max-height:88vh;overflow:auto;border-radius:18px;padding:22px;direction:rtl"><h2>پیش‌نمایش پیشنهاد هوش مصنوعی</h2>${inner}<div style="margin-top:18px"><button class="primary ai-apply">تأیید و اعمال</button> <button class="smallbtn ai-cancel">انصراف</button></div></div>`;
  document.body.appendChild(o);o.querySelector('.ai-cancel').onclick=()=>o.remove();o.querySelector('.ai-apply').onclick=()=>{onApply(o);o.remove()}
}
async function aiAction(i,type){
  sync(); const a=D.articles[i]; if(!a)return;
  const btn=event?.target; const old=btn?.textContent; if(btn){btn.disabled=true;btn.textContent='در حال پردازش...'}
  try{
    const r=await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:type,article:a})});
    if(type==='excerpt'){
      aiOverlay(`<label>چکیده پیشنهادی</label><textarea id="aiExcerpt">${esc(r.excerpt||'')}</textarea>`,o=>{a.excerpt=o.querySelector('#aiExcerpt').value;render()});
    }else if(type==='write_body'){
      aiOverlay(`<label>متن پیشنهادی مقاله</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{a.body=o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='continue_body'){
      aiOverlay(`<label>ادامه پیشنهادی متن</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{a.body=(a.body||'')+o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='article'){
      aiOverlay(`<label>چکیده پیشنهادی</label><textarea id="aiExcerpt">${esc(r.excerpt||a.excerpt||'')}</textarea><label>متن بازنویسی‌شده</label><div id="aiBody" class="editor" contenteditable="true">${r.body||a.body||''}</div>`,o=>{a.excerpt=o.querySelector('#aiExcerpt').value;a.body=o.querySelector('#aiBody').innerHTML;render()});
    }else if(type==='seo'){
      aiOverlay(`<div class="form-grid"><div><label>SEO Title</label><input id="aiSeoTitle" value="${esc(r.title||'')}"></div><div><label>Slug</label><input id="aiSlug" value="${esc(r.slug||'')}"></div></div><label>Meta Description</label><textarea id="aiDesc">${esc(r.description||'')}</textarea>`,o=>{a.seo={...a.seo,mode:'ai',title:o.querySelector('#aiSeoTitle').value,slug:o.querySelector('#aiSlug').value,description:o.querySelector('#aiDesc').value};render()});
    }
  }catch(e){alert('خطا: '+e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
async function generateArticleAI(){
  sync(); const topic=prompt('موضوع مقاله را بنویسید:'); if(!topic)return;
  try{
    const r=await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'generate',topic,article:{title:topic,excerpt:'',body:'',category:'آموزش'}})});
    aiOverlay(`<label>عنوان</label><input id="aiTitle" value="${esc(r.title||topic)}"><label>چکیده</label><textarea id="aiExcerpt">${esc(r.excerpt||'')}</textarea><label>متن مقاله</label><div id="aiBody" class="editor" contenteditable="true">${r.body||''}</div>`,o=>{
      D.articles.unshift({id:'a'+Date.now(),status:'draft',category:r.category||'آموزش',title:o.querySelector('#aiTitle').value,excerpt:o.querySelector('#aiExcerpt').value,image:'',video:'',body:o.querySelector('#aiBody').innerHTML,seo:{mode:'auto',title:'',description:'',slug:'article-'+Date.now(),canonical:'',ogImage:'',schemaType:'Article'}});
      render();
    });
  }catch(e){alert('خطا: '+e.message)}
}
save.onclick=async()=>{sync();try{await api('/api/admin/site',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});saveMsg.className='success';saveMsg.textContent='✓ ذخیره شد'}catch(e){saveMsg.textContent=e.message}};
loadAdmin().catch(()=>{});
</script></body></html>
