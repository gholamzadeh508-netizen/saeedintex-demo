<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقاله | سعید اینتکس</title><link rel="stylesheet" href="/style.css"></head><body><div id="head"></div><section class="section"><div class="wrap article-shell"><main class="article-box" id="content"></main><aside class="side-box"><h3>دسترسی سریع</h3><p><a class="read" href="/articles.html">← همه مقالات</a></p><p><a class="read" href="/questions.html">← پرسش و پاسخ</a></p><p><a class="read" id="shopSide" target="_blank">← فروشگاه اصلی</a></p></aside></div></section><div id="foot"></div><script src="/app.js"></script><script>(async()=>{const d=await api('/api/site');head.innerHTML=nav('articles');foot.innerHTML=footer();shopNav.href=d.settings.shopUrl;shopSide.href=d.settings.shopUrl;const id=new URLSearchParams(location.search).get('id'),a=d.articles.find(x=>x.id===id)||d.articles[0];document.title=a.title+' | سعید اینتکس';content.innerHTML=`<span class="tag">${esc(a.category)}</span><h1>${esc(a.title)}</h1><p>${esc(a.excerpt)}</p>${a.image?`<img class="article-cover" src="${a.image}" alt="${esc(a.title)}">`:''}${a.video?`<p><a class="primary" href="${a.video}" target="_blank">مشاهده ویدیو</a></p>`:''}<div class="article-body">${a.body}</div><hr><a class="primary" href="${d.settings.shopUrl}" target="_blank">مشاهده قیمت و موجودی در فروشگاه اصلی</a>`;
const viewKey='saeedintex_view_'+a.id;
if(!sessionStorage.getItem(viewKey)){
  sessionStorage.setItem(viewKey,'1');
  fetch('/api/articles/'+encodeURIComponent(a.id)+'/view',{method:'POST'}).catch(()=>{});
}
})();</script></body></html>
