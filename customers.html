<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربه مشتریان | سعید اینتکس</title><link rel="stylesheet" href="/style.css"></head><body><div id="nav"></div><section class="page-hero"><div class="wrap"><h1>تجربه‌های واقعی</h1><p>نمونه‌هایی از تست، استفاده و تجربه مشتریان.</p></div></section><section class="section"><div class="wrap"><div class="grid2" id="customers"></div></div></section><div id="footer"></div><script src="/data.js"></script><script src="/app.js"></script><script>const d=loadData();document.getElementById('nav').innerHTML=nav('customers');document.getElementById('footer').innerHTML=footer();document.getElementById('customers').innerHTML=d.customers.map(c=>`<article class="card"><img src="${c.image}"><div class="card-body"><h3>${c.title}</h3><p>${c.text}</p></div></article>`).join('');document.getElementById('shopNav').href=d.site.shopUrl;</script></body></html>
