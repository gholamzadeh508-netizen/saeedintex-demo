<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرسش و پاسخ | سعید اینتکس</title><link rel="stylesheet" href="/style.css"></head><body><div id="head"></div><section class="page-hero"><div class="wrap"><h1>پرسش و پاسخ کاربران</h1><p>سؤال بپرسید؛ کاربران و سعید اینتکس می‌توانند پاسخ دهند.</p></div></section><section class="section"><div class="wrap grid2"><div id="qs"></div><div class="article-box"><h2>سؤال جدید</h2><label>نام</label><input id="author"><label>عنوان سؤال</label><input id="title"><label>توضیحات</label><textarea id="body"></textarea><button class="primary" id="send">ارسال سؤال</button><p id="msg"></p></div></div></section><div id="foot"></div><script src="/app.js"></script><script>
(async()=>{const d=await api('/api/site');head.innerHTML=nav('qa');foot.innerHTML=footer();shopNav.href=d.settings.shopUrl;qs.innerHTML=d.questions.filter(q=>q.status==='approved').map(q=>`<div class="qa" id="${q.id}"><h3>${esc(q.title)}</h3><p>${esc(q.body)}</p>${(q.answers||[]).filter(a=>a.status==='approved').map(a=>`<div class="answer ${a.official?'official':''}"><b>${esc(a.author)}</b>${a.official?' <span class="pill">پاسخ رسمی</span>':''}<p>${esc(a.body)}</p></div>`).join('')}<details><summary class="read">پاسخ شما</summary><input class="ans-author" placeholder="نام"><textarea class="ans-body" placeholder="پاسخ"></textarea><button class="primary answer-send" data-id="${q.id}">ارسال پاسخ</button></details></div>`).join('');document.querySelectorAll('.answer-send').forEach(b=>b.onclick=async()=>{const p=b.closest('.qa');try{const r=await api('/api/questions/'+b.dataset.id+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:p.querySelector('.ans-author').value,body:p.querySelector('.ans-body').value})});alert(r.message)}catch(e){alert(e.message)}})})();
send.onclick=async()=>{try{const r=await api('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:author.value,title:title.value,body:body.value})});msg.textContent=r.message;title.value='';body.value=''}catch(e){msg.textContent=e.message}};
</script></body></html>
